[project]
name = "university-schedule"
version = "0.1.0"

requires-python = ">=3.14,<3.15"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "aiogram (>=3.31.0,<4.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "tortoise-orm (>=1.1.8,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
